[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zipsearch"
version = "6.0.0"
description = "Search text and structured records inside ZIP archives without bulk extraction."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ZipSearch contributors"}]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Archiving",
]
keywords = ["zip", "search", "archives", "forensics", "grep"]

[project.urls]
Homepage = "https://github.com/romantrnt/zipsearch"
Repository = "https://github.com/romantrnt/zipsearch"
Issues = "https://github.com/romantrnt/zipsearch/issues"

[project.scripts]
zipsearch = "zipsearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
